[package]
name = "carnet"
version = "0.1.0"
edition = "2021"
description = "Pipeline médias du site des voyages"
publish = false

# Chaque dépendance est justifiée dans le message de commit qui l'introduit
# (SPEC.md, section 12). Les dépendances des lots suivants (image, ravif,
# geojson, geo, ureq) ne sont pas déclarées tant qu'aucun code ne les utilise.
[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rayon = "1"
indicatif = "0.17"
nom-exif = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
