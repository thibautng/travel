# Corrections manuelles du Tour des Alpes. Voir SPEC.md, section 7.
#
# Une surcharge écrase l’EXIF, toujours, sans avertissement. En contrepartie,
# `carnet check` liste ce qui a été appliqué et échoue sur une surcharge qui
# ne vise rien.
#
# Ce qui ne figure pas ici, volontairement :
#
# - Les cinq fichiers repartagés de C3 (IMG_20260730_071148 et les autres)
#   n’ont pas besoin de surcharge : leur EXIF porte déjà la bonne date, et le
#   pipeline date par l’EXIF. L’exemple de la section 7 de la spec est une
#   illustration du mécanisme, pas une correction nécessaire.
# - Aucune exclusion : les 833 médias sont inventoriés. Le tri de ce qui est
#   publié relève de selection.yaml (D7), pas d’ici.

# Contrainte C4 : 14 fichiers GoPro HERO7, sans GPS, tous horodatés au
# 3 janvier 2016. Le motif couvre GOPR2699 à GOPR2717 : « GOPR27* » raterait
# GOPR2699, premier du lot.
lots:
  - motif: "GOPR2*.JPG"
    jour: 2026-08-02
    position: { lat: 46.2010, lon: 13.6480 }
    note: "GoPro sans GPS, horloge perdue. Canyoning du Sušec. Les quatorze
      fichiers sont empilés sur un point unique, et c’est voulu : les photos
      d’eau ont été prises au même endroit, il y avait peu de mouvement."

# Contrainte C5 : deux journées ont un trou de trace assumé, que le GPS ne
# peut pas combler. Ces tronçons sont tracés à la main.
segments:
  # Du camping de Ramsau à l’embarcadère du Königssee. Aucune photo pendant
  # le trajet : les premières de la journée sont déjà prises à l’embarcadère.
  # `calculer` fait tracer la route par le moteur au lieu d’une droite.
  - jour: 2026-07-31
    mode: route
    calculer: true
    points: [[12.89263, 47.60736], [12.98931, 47.58931]]
    note: "Winkl-Landthal vers l’embarcadère du Königssee, en voiture."

  - jour: 2026-07-31
    mode: bateau
    points: [[12.9887, 47.5893], [12.9797, 47.5225], [12.9847, 47.4967]]
    note: "Königssee, Schönau vers St. Bartholomä puis Salet. Décrochage GPS en vallée encaissée."

  # 28 juillet : le retour du Hoellentalklamm n’est pas photographié. La
  # dernière photo est prise à mi-descente ; sans ce tronçon, la journée ne
  # compte que l’aller, alors que la marche est un aller-retour.
  - jour: 2026-07-28
    mode: marche
    calculer: true
    points: [[11.0338, 47.4409], [11.0375, 47.4696]]
    note: "Descente de la Hoellentalangerhuette au parking de Hammersbach."

  # Le train part de Lienz, la ou la sortie s’arrete, et rejoint la derniere
  # position relevee du retour. Sans ce tronçon, la ligne du train commencait
  # sept kilomètres avant Lienz, la ou se trouve la derniere photo.
  - jour: 2026-08-06
    mode: train
    points: [[12.7690, 46.8290], [12.6868, 46.7854]]
    note: "Depart du train, de Lienz vers la vallee de la Drave."

  - jour: 2026-08-06
    mode: velo
    apres: IMG20260806161600
    points: [[12.6868, 46.7854], [12.7690, 46.8290]]
    note: "Derniers kilomètres vers Lienz, après la dernière photo de la sortie.
      La sortie est partie de San Candido, pas de Tassenbach, et les photos la
      documentent jusqu’à ce point : ce segment ne couvre que ce qui manque,
      au lieu de doubler le trajet mesuré."

# Modes de déplacement, quand l’inférence par la vitesse se trompe.
# Une voiture arrêtée pour déjeuner affiche la vitesse moyenne d’un vélo.
#
# Les plages horaires encadrent les seuls tronçons à corriger, et jamais une
# marche : forcer une journée entière convertirait aussi les randonnées.
modes:
  # Journée de transit : Kobarid, halte du midi au Faaker See en Autriche,
  # puis le Sud-Tyrol. Aucune photo pendant les trajets, seulement aux
  # étapes, d’où une trace qui ne montrait rien.
  - jour: 2026-08-05
    mode: route
    note: "Kobarid vers le Sud-Tyrol par l’Autriche, halte au Faaker See."

  # 25 juillet, deux trajets en voiture dans la Forêt-Noire.
  - jour: 2026-07-25
    mode: route
    de: "12:15"
    a: "12:25"
  - jour: 2026-07-25
    mode: route
    de: "16:45"
    a: "19:05"

  # 26 juillet, route de la Forêt-Noire vers Garmisch, de part et d’autre du
  # long tronçon que la vitesse avait déjà reconnu.
  - jour: 2026-07-26
    mode: route
    de: "12:15"
    a: "12:25"
  - jour: 2026-07-26
    mode: route
    de: "19:35"
    a: "19:45"

  # 27 juillet. La journée est en voiture, sauf le tour de l’Eibsee à pied,
  # de 16 h 40 à 19 h. Le trajet du Tennsee à Garmisch, onze kilomètres avec
  # quatre heures entre deux photos, passait pour de la marche à 2 km/h : le
  # temps est celui de l’installation du camp et des courses, pas du trajet.
  - jour: 2026-07-27
    mode: marche
    de: "16:25"
    a: "19:00"
    note: "Tour complet de l’Eibsee à pied. La borne haute exclut la photo de
      19 h 07, qui ouvre le retour en voiture vers Garmisch."
  - jour: 2026-07-27
    mode: route

  # 29 juillet. Route du camp à l’Hintersee, puis à l’église de Ramsau, puis
  # retour. La seule marche est la demi-boucle de l’Hintersee. Les trajets,
  # espacés de plusieurs heures entre deux photos, passaient pour de la
  # marche et du vélo.
  - jour: 2026-07-29
    mode: marche
    de: "18:02"
    a: "18:40"
    note: "Demi-boucle de l’Hintersee."
  - jour: 2026-07-29
    mode: route

  # 30 juillet, route vers Salzbourg.
  - jour: 2026-07-30
    mode: route
    de: "10:45"
    a: "10:55"

  # 31 juillet, tout ce qui bouge est sur le lac. La voiture s’est arrêtée à
  # l’embarcadère avant la première photo, et son trajet est déclaré en segment
  # calculé plus haut. Ce qui suit est la traversée vers St. Bartholomä.
  - jour: 2026-07-31
    mode: bateau
    de: "08:45"
    a: "09:25"
  - jour: 2026-07-31
    mode: bateau
    de: "11:44"
    a: "12:00"
  - jour: 2026-07-31
    mode: bateau
    de: "12:15"
    a: "12:55"

  # 3 août, route vers le col de Vršič.
  - jour: 2026-08-03
    mode: route
    de: "12:20"
    a: "12:25"

  # 8 août, montée et descente des Tre Cime en bus. La randonnée entre les
  # deux, de 12 h 40 à 16 h 01, reste de la marche.
  - jour: 2026-08-08
    mode: route
    de: "09:35"
    a: "12:39"
  - jour: 2026-08-08
    mode: route
    de: "16:02"
    a: "16:10"

  # 9 août, route du Sud-Tyrol vers le Seiser Alm.
  - jour: 2026-08-09
    mode: route
    de: "17:55"
    a: "19:10"

  # 6 août. Toute la journée est à vélo jusqu’à Lienz, puis en train au
  # retour. Aucune marche : les arrêts à une ou deux heures que l’inférence
  # prenait pour de la marche sont des portions lentes de la sortie. Quelques
  # sauts de position donnaient par ailleurs des vitesses de 60 à 300 km/h,
  # qui envoyaient des tronçons au routeur automobile.
  - jour: 2026-08-06
    mode: train
    de: "16:10"
    a: "23:59"
    note: "Retour de Lienz à San Candido en train."
  - jour: 2026-08-06
    mode: velo
    note: "Le reste de la journée est la sortie sur la piste de la Drave."

  # 11 août, descente vers le lac de Garde. Un seul tronçon de 89 km, que dix
  # heures d’écart entre deux photos faisaient passer pour du vélo.
  - jour: 2026-08-11
    mode: route
    de: "08:20"
    a: "08:30"

# Points de passage imposés aux itinéraires calculés. Le moteur propose le
# trajet le plus rapide, qui n’est pas celui qui a été pris.
itineraires:
  # 26 juillet, de la Forêt-Noire à Garmisch par les nationales, pas par
  # l’autoroute au nord. Les deux points sont des lieux traversés ce jour-là,
  # relevés par les photos de 12 h 19 et 13 h 05.
  - jour: 2026-07-26
    points_de_passage: [[8.95089, 48.33556], [9.11544, 48.28882]]
    note: "Nationales par Burladingen, et non l’autoroute par Stuttgart et Ulm."

  # 12 août, départ de Riva del Garda par la rive ouest du lac, via Gargnano
  # et Salò. Le point est celui de la photo de la Piazza Feltrinelli.
  - jour: 2026-08-12
    points_de_passage: [[10.66375, 45.68815]]
    note: "Rive ouest du lac de Garde, par Gargnano et Salò."

  # 15 août, retour par le col du Petit-Saint-Bernard et non par le tunnel du
  # Mont-Blanc. Le point est celui des photos prises au col à 13 h 39.
  # Deux points, et l’ordre compte. Avec le seul col, le moteur y montait
  # puis redescendait en Italie pour prendre le tunnel du Mont-Blanc, qu’il
  # jugeait plus rapide vers Paris. Le second point, relevé près de Lyon à
  # 17 h 45, force la descente par la Tarentaise.
  - jour: 2026-08-15
    points_de_passage: [[6.88669, 45.68517], [5.21311, 45.61349]]
    note: "Col du Petit-Saint-Bernard puis la Tarentaise et Lyon, et non le
      tunnel du Mont-Blanc."
