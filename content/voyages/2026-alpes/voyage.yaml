# Métadonnées du voyage. Voir SPEC.md, section 5.1.
# Les lieux arrivent au lot 2 : le lot 1 ne lit que la source et le fuseau.

id: 2026-alpes
titre: Tour des Alpes orientales et Slovénie
sous_titre: Allemagne, Autriche, Slovénie, Italie
date_debut: 2026-07-24
date_fin: 2026-08-15
pays: [DE, AT, SI, IT, FR]
distance_km: 4400
nuits: 22
mode: voiture et camping

# Toutes les étapes du voyage sont en CEST. Voir SPEC.md, section 6.2, note
# de fin : aucune résolution de fuseau à partir des coordonnées n'est faite.
fuseau: Europe/Paris

# Dossier en LECTURE SEULE. Le pipeline ne doit jamais y écrire.
source_photos: "P:/Photos/Thibaut/2026 Tour des Alpes"

# Contrainte C8 : [Originals] contient des homonymes des fichiers de la racine.
dossiers_ignores:
  - "[Originals]"
  - ".thumbnails"
  - "@eaDir"

notion: "https://app.notion.com/p/371ec81aae12810fa2e9dfbe7adbcff8"

# Le voyage part de la maison et y revient. Sans ces deux références, la
# trace commencerait à la première photo, en Moselle, et s'arrêterait à la
# dernière, en Isère : plus de huit cents kilomètres manquants.
depart: paris
arrivee: paris

# Les huit campings du voyage. Noms donnés de mémoire, dates et positions
# vérifiées contre les photos du soir et du matin. Le total fait 22 nuits,
# ce qui concorde avec l'annonce du voyage.
#
# `du` est le jour d'arrivée, `au` le jour de départ. Le camping du 12 au
# 15 août couvre donc les nuits des 12, 13 et 14.
lieux:
  # Point de départ et d'arrivée du voyage.
  #
  # La position est celle du centre de Paris, pas celle du domicile. Le dépôt
  # est public et le site est destiné à être partagé : l'adresse exacte de la
  # famille n'a pas à y figurer, et l'écart de quelques kilomètres est
  # invisible à l'échelle d'un trajet de huit cents kilomètres.
  - id: paris
    nom: Paris
    type: etape
    position: { lat: 48.85660, lon: 2.35220 }

  - id: traiermuhle
    nom: Campingplatz Traiermühle
    type: camp
    position: { lat: 48.42922, lon: 8.18106 }
    du: 2026-07-24
    au: 2026-07-26

